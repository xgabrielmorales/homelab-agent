name: homelab-agent-dev

include:
  - environment/base/otel-lgtm.yml

services:
  agent:
    extends:
      file: environment/base/agent.yml
      service: agent-base
    build:
      context: .
      dockerfile: ./environment/dev/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: dev
    depends_on:
      - otel-lgtm
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    tty: true
    stdin_open: true
