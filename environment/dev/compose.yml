name: homelab-agent-dev

include:
  - environment/base/otel-lgtm.yml

services:
  agent:
    extends:
      file: environment/base/agent.yml
      service: agent-base
    build:
      context: .
      dockerfile: ./environment/dev/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: dev
    depends_on:
      - otel-lgtm
      - mcp-grafana
      - mcp-kubernetes
      - gotify
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    tty: true
    stdin_open: true

  mcp-grafana:
    image: grafana/mcp-grafana:2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
    restart: unless-stopped
    entrypoint:
      - /app/mcp-grafana
      - --transport
      - streamable-http
      - --address
      - 0.0.0.0:8001
      - --allowed-hosts
      - mcp-grafana:8001
      - --disable-write
      - --enabled-tools
      - search,datasource,prometheus,loki,alerting,dashboard
      - --usage-stats
      - disabled
    environment:
      GRAFANA_URL: https://grafana.xgabrielmorales.com
      GRAFANA_SERVICE_ACCOUNT_TOKEN:

  mcp-kubernetes:
    image: quay.io/containers/kubernetes_mcp_server:v0.1.3@sha256:6347155616c49c78512114500688b50d275ddde7597b6a38cefe6f40a8c42c16
    restart: unless-stopped
    user: "0:0"
    command: [ "--config", "/config.toml" ]
    volumes:
      - ./environment/dev/kubernetes-mcp-server.toml:/config.toml:ro
      - ${XDG_RUNTIME_DIR}/homelab-kubeconfig:/kubeconfig:ro

  gotify:
    image: gotify/server:3.1.1@sha256:44fc5bbd1c0618878e33073d38c2c13126b48f245c3fe12236b1da48eb203b86
    restart: unless-stopped
    environment:
      GOTIFY_DEFAULTUSER_PASS:
    ports:
      - "8090:80"
