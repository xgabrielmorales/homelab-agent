[project]
name = "homelab-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "logfire[httpx]==6.0.0",
    "pydantic==2.14.4",
    "pydantic-ai-slim[retries]==2.71.0",
    "pydantic-settings==2.16.3",
    "scalar-fastapi==1.9.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "prek==0.5.11",
    "ruff==0.17.6",
    "zuban==0.10.2",
]

[tool.uv]
add-bounds = "exact"

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.zuban]
strict = true
ignore_missing_imports = true
